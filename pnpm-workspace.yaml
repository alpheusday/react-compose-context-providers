packages:
    - package
    - tests/*
    - example

autoInstallPeers: false
strictPeerDependencies: false

allowBuilds:
    esbuild: true

catalogs:
    dev:
        "@types/react": ^18.0.0
        react: 18.0.0
    peer:
        react: ^18.0.0 || ^19.0.0
    test:
        "@testing-library/dom": ^10.4.2
        "@testing-library/react": ^16.3.3
        happy-dom: ^20.13.2
        vitest: ^5
    react18:
        "@types/react": ^18.0.0
        "@types/react-dom": ^18.0.0
        react: 18.0.0
        react-dom: 18.0.0
    react19:
        "@types/react": ^19.0.0
        "@types/react-dom": ^19.0.0
        react: 19.0.0
        react-dom: 19.0.0

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
    - "@apst/*"
