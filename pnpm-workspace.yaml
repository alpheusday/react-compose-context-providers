packages:
    - ./package
    - ./test
    - ./example

autoInstallPeers: false
strictPeerDependencies: false

allowBuilds:
    esbuild: true

catalogs:
    dev:
        "@types/react": ^18.0.0
        react: 18.0.0
    peer:
        react: ^18.0.0 || ^19.0.0
    test:
        "@types/react-dom": ^19.2.3
        react-dom: 19.2.7

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
    - "@apst/*"
