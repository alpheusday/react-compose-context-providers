packages:
    - package
    - test
    - example

autoInstallPeers: false
strictPeerDependencies: false

allowBuilds:
    esbuild: true

catalogs:
    dev:
        "@types/react": ^18.0.0
        react: 18.0.0
    peer:
        react: ^18.0.0 || ^19.0.0
    test:
        "@types/react-dom": ^18.0.0
        react-dom: 18.0.0

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
    - "@apst/*"
